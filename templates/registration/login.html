<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AI Music Generator</title>
  <script>
    (function() {
      var t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    :root {
      --bg: #0f0f13; --surface: #1a1a24; --border: #2e2e42;
      --text: #e8e8f0; --muted: #6b6b8a; --label: #a0a0b8;
      --accent: #7c3aed; --accent-hover: #6d28d9; --input-bg: #0f0f18;
      --danger-bg: #7f1d1d; --danger-text: #fca5a5; --danger-bg-dark: #3b1c1c;
    }
    [data-theme="light"] {
      --bg: #f0f0f5; --surface: #ffffff; --border: #d1d1db;
      --text: #1a1a2e; --muted: #6b6b8a; --label: #4a4a60;
      --accent: #7c3aed; --accent-hover: #6d28d9; --input-bg: #f5f5fa;
      --danger-bg: #991b1b; --danger-text: #ffffff; --danger-bg-dark: #fee2e2;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 2.5rem 3rem; max-width: 400px; width: 90%;
    }
    .brand { font-size: 1.4rem; font-weight: 700; color: #a78bfa; margin-bottom: 0.25rem; }
    .subtitle { font-size: 0.85rem; color: var(--muted); margin-bottom: 2rem; }
    .alert-error {
      background: var(--danger-bg-dark); border: 1px solid var(--danger-bg); color: var(--danger-text);
      border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.85rem;
    }
    label { display: block; font-size: 0.85rem; color: var(--label); margin-bottom: 0.3rem; margin-top: 1rem; }
    input[type=text], input[type=password] {
      width: 100%; padding: 0.6rem 0.75rem; border-radius: 7px;
      border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 0.95rem;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button[type=submit] {
      margin-top: 1.5rem; width: 100%; padding: 0.65rem;
      background: var(--accent); color: #fff; border: none; border-radius: 7px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    button[type=submit]:hover { background: var(--accent-hover); }
    .divider {
      display: flex; align-items: center; gap: 0.75rem; margin: 1.25rem 0;
    }
    .divider hr { flex: 1; border: none; border-top: 1px solid var(--border); }
    .divider span { font-size: 0.78rem; color: var(--muted); }
    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      width: 100%; padding: 0.6rem; background: #fff; color: #0f0f13;
      border: 1px solid var(--border); border-radius: 7px;
      font-size: 0.9rem; font-weight: 600; text-decoration: none; cursor: pointer;
    }
    .btn-google:hover { background: #f5f5f5; }
    .hint { margin-top: 1.25rem; font-size: 0.78rem; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">AI Music Generator</div>
    <div class="subtitle">Sign in to generate and manage your tracks</div>

    {% if form.errors %}
      <div class="alert-error">Invalid username or password. Please try again.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <label for="id_username">Username</label>
      <input type="text" id="id_username" name="username" autofocus autocomplete="username">

      <label for="id_password">Password</label>
      <input type="password" id="id_password" name="password" autocomplete="current-password">

      <button type="submit">Sign In</button>
    </form>

    <div class="divider">
      <hr><span>or</span><hr>
    </div>

    <a href="{% url 'google_login' %}{% if next %}?next={{ next }}{% endif %}" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </a>

    <p class="hint">Use <code>python manage.py createsuperuser</code> to create an admin account.</p>
  </div>
</body>
</html>
